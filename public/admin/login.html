<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - UMKM Kasih Ibu</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
    <div class="login-box">
        <img src="../img/logo-kasihibu.jpeg" alt="Logo UMKM Kasih Ibu" class="login-logo">
        <h2>Login Admin</h2>
        <p class="subtitle">UMKM Kasih Ibu - Kabupaten Bima</p>

        <div id="error-msg" class="error-msg" style="display:none;"></div>

        <form id="login-form">
            <label>Username</label>
            <input type="text" id="username" required>

            <label>Password</label>
            <div class="password-wrap">
                <input type="password" id="password" required>
                <span class="toggle-password" id="toggle-password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></span>
            </div>

            <button type="submit">Masuk</button>
        </form>
    </div>

    <script src="../js/config.js"></script>
    <script src="../js/adminAuth.js"></script>
</body>
</html>
